# Dependabot: weekly dependency updates plus security PRs.
# Alerts and security updates are switched on in the repo settings as well.
version: 2

updates:
  # Swift Package Manager dependencies (Package.resolved).
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      swift:
        patterns: ["*"]
  # Docs site (bun.lock).
  - package-ecosystem: "bun"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Next.js and its config/lint packages move together.
      nextjs:
        patterns: ["next", "eslint-config-next", "@next/*"]
      minor-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
